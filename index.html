<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vereinsradar Dashboard</title>
    <link rel="stylesheet" href="vereinsseiten_ui.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-area">
          <button id="menuButton" class="burger-button" type="button" aria-label="Bundesland-Menue oeffnen" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div class="brand-mark" aria-hidden="true">VR</div>
          <div>
            <p class="eyebrow">Vereinsradar</p>
            <h1>Kommunen & Vereinsseiten</h1>
          </div>
        </div>

        <div class="header-search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Gemeinde, Bundesland, Homepage oder Vereinslink suchen">
        </div>

        <div class="header-actions">
          <label class="ghost-button">
            Datei laden
            <input id="fileInput" type="file" accept="application/json,.json">
          </label>
          <button id="resetButton" class="primary-button" type="button">Reset</button>
        </div>
      </header>

      <section class="metric-grid" aria-label="Kennzahlen">
        <article class="metric-card">
          <span class="metric-icon" aria-hidden="true">◎</span>
          <div>
            <span>Gemeinden</span>
            <strong id="municipalityMetric">0</strong>
            <small id="municipalitySubMetric">0 sichtbar</small>
          </div>
        </article>
        <article class="metric-card">
          <span class="metric-icon orange" aria-hidden="true">⌂</span>
          <div>
            <span>Gemeindehomepages</span>
            <strong id="homepageMetric">0%</strong>
            <small id="homepageSubMetric">0 von 0</small>
          </div>
        </article>
        <article class="metric-card">
          <span class="metric-icon green" aria-hidden="true">✓</span>
          <div>
            <span>Vereinsseiten</span>
            <strong id="clubCoverageMetric">0%</strong>
            <small id="clubCoverageSubMetric">0 Gemeinden</small>
          </div>
        </article>
        <article class="metric-card">
          <span class="metric-icon blue" aria-hidden="true">↗</span>
          <div>
            <span>Vereinslinks</span>
            <strong id="clubLinkMetric">0</strong>
            <small id="clubLinkSubMetric">0 sichtbar</small>
          </div>
        </article>
      </section>

      <section class="workspace">
        <section class="content-column">
          <section class="filter-card" aria-label="Filter">
            <label>
              Mindestscore
              <input id="minScoreInput" type="number" min="0" step="10" placeholder="egal">
            </label>
            <label>
              Sortierung
              <select id="sortSelect">
                <option value="state">Bundesland</option>
                <option value="name">Gemeinde A-Z</option>
                <option value="clubs">Vereinslinks</option>
                <option value="score">Hoechster Score</option>
              </select>
            </label>
            <label class="switch-row">
              <input id="withClubsOnlyInput" type="checkbox">
              <span>Nur mit Vereinsseite</span>
            </label>
            <button id="expandGroupsButton" class="ghost-button" type="button">Alle Gruppen öffnen</button>
          </section>

          <section class="tab-card" aria-label="Ansichten">
            <button class="tab-button active" type="button" data-tab-target="clubs">Vereine</button>
            <button class="tab-button" type="button" data-tab-target="homepages">Gemeindeseiten</button>
            <button class="tab-button" type="button" data-tab-target="municipalities">Gemeinden</button>
          </section>

          <section class="results-card" aria-label="Ergebnisse">
            <div class="results-head">
              <div>
                <p id="activeTabLabel" class="eyebrow">Vereine</p>
                <h2 id="resultsTitle">Alle Bundeslaender</h2>
              </div>
              <div class="results-meta">
                <strong id="summaryText">0 Ergebnisse</strong>
                <div id="paginationTop" class="pagination compact"></div>
              </div>
            </div>
            <div id="emptyState" class="empty-state" hidden>Keine passenden Ergebnisse.</div>
            <div id="resultsList" class="results-list"></div>
            <div id="paginationBottom" class="pagination"></div>
          </section>
        </section>

        <aside id="stateSidebar" class="state-sidebar" aria-label="Bundeslaender">
          <div class="sidebar-head">
            <div>
              <p class="eyebrow">Abdeckung</p>
              <h2>Bundeslaender</h2>
            </div>
            <button id="clearStateButton" class="text-button" type="button">Alle</button>
          </div>
          <div id="stateProgressList" class="state-list"></div>
          <div class="source-card">
            <span>Datenquellen</span>
            <strong id="sourceLabel">Lade Daten...</strong>
          </div>
        </aside>
      </section>
    </main>

    <div id="navBackdrop" class="nav-backdrop" hidden></div>
    <script src="vereinsseiten_ui.js"></script>
  </body>
</html>
